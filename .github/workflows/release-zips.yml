name: Build Downloadable Zips

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create per-pack zips
        run: |
          mkdir -p dist

          cd practice-packs

          zip -r ../dist/pack-1-cluttered-folder.zip  01-cluttered-folder  -x '*.git*'
          zip -r ../dist/pack-2-receipts.zip          02-receipts          -x '*.git*' '*.DS_Store'
          zip -r ../dist/pack-3-decomposition.zip     03-decomposition     -x '*.git*'
          zip -r ../dist/pack-4-worked-example.zip    04-worked-example    -x '*.git*'
          zip -r ../dist/pack-5-verification.zip      05-verification      -x '*.git*'
          zip -r ../dist/pack-6-persistence.zip       06-persistence       -x '*.git*'

          cd ..
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            ## Problem-Solving Practice Packs — ${{ github.ref_name }}

            Download only the pack you need:

            | Asset | Serves | What you practice |
            | ----- | ------ | ----------------- |
            | `pack-1-cluttered-folder.zip`  | Practice 1 (P1)    | Inspect-before-act on a messy folder |
            | `pack-2-receipts.zip`          | Practice 2 (P2)    | Mixed-format receipts — see why code outpaces specialized apps |
            | `pack-3-decomposition.zip`     | Practice 4 (P4)    | Big-prompt failure vs decomposed success |
            | `pack-4-worked-example.zip`    | Part 10 capstone   | Full Understand → Plan → Execute → Reflect loop |
            | `pack-5-verification.zip`      | Practice 3 (P3)    | Ground every claim to source on a staged deliverable |
            | `pack-6-persistence.zip`       | Practice 5 (P5)    | Run the same task twice with and without a CLAUDE.md |

            Each zip contains a single self-contained pack with its own `README.md`. You do not need the other packs to use one pack.
